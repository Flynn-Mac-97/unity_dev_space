<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Island Map Painter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { overflow: hidden; }
    .sb-scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: #4b5563 #1f2937; }
    .sb-scroll::-webkit-scrollbar { width: 6px; }
    .sb-scroll::-webkit-scrollbar-track { background: #1f2937; }
    .sb-scroll::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    input[type="color"] { -webkit-appearance: none; border: 1px solid #4b5563; border-radius: 4px; padding: 1px; cursor: pointer; background: #374151; }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }
    .type-card { background: #111827; border: 1px solid #374151; border-radius: 6px; padding: 10px; margin-bottom: 8px; }
    .tool-btn { transition: background 0.15s; }
    .tool-btn.active { background: #4f46e5 !important; color: white !important; }
    .tab-btn.active { background: #4f46e5 !important; color: white !important; }
    #mapCanvas { cursor: crosshair; image-rendering: pixelated; }
    #canvasFrame { position: relative; display: inline-block; align-self: flex-start; }
    .resize-handle {
      position: absolute;
      z-index: 30;
      background: rgba(99, 102, 241, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    .resize-handle-right { top: 12px; bottom: 12px; right: -6px; width: 12px; cursor: e-resize; }
    .resize-handle-bottom { left: 12px; right: 12px; bottom: -6px; height: 12px; cursor: s-resize; }
    .resize-handle-corner { width: 14px; height: 14px; right: -7px; bottom: -7px; cursor: nwse-resize; border-radius: 4px; }
    .modal-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); }
    .vis-row:hover { background: #1f2937; }
  </style>
</head>
<body class="bg-gray-900 text-gray-200 h-screen flex flex-col select-none text-sm">

  <!-- Top Bar -->
  <header class="bg-gray-800 border-b border-gray-700 px-3 py-2 flex items-center gap-2 flex-shrink-0 flex-wrap">
    <input id="mapNameInput" type="text" class="bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm w-52 focus:outline-none focus:border-indigo-500" value="Floating Island Map" oninput="S.setMapName(this.value)">
    <div class="h-5 w-px bg-gray-600 mx-1"></div>
    <button onclick="S.saveToDataFolder()" class="bg-sky-800 hover:bg-sky-700 px-2 py-1 rounded text-xs">💽 Save Data</button>
    <button onclick="S.loadFromDataFolder()" class="bg-sky-800 hover:bg-sky-700 px-2 py-1 rounded text-xs">📥 Load Data</button>
    <button onclick="S.clearMap()" class="bg-red-800 hover:bg-red-700 px-2 py-1 rounded text-xs">🗑 Clear Map</button>
    <div class="flex-1"></div>
    <div id="statusArea" class="text-xs max-w-xs truncate"></div>
  </header>

  <!-- Main Content -->
  <div class="relative flex flex-1 overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-72 bg-gray-800 border-r border-gray-700 flex flex-col flex-shrink-0">
      <div id="modeSwitch" class="p-3 pb-0 flex-shrink-0"></div>
      <div class="sb-scroll flex-1 p-3 pt-2 space-y-3" id="sidebar"></div>
    </aside>

    <!-- Canvas Area -->
    <main id="canvasViewport" class="relative flex-1 flex flex-col items-center overflow-auto bg-gray-950 p-4">
      <div id="canvasFrame">
        <canvas id="mapCanvas" width="1536" height="1536" class="rounded shadow-lg shadow-black/40"></canvas>
        <div id="resizeHandleRight" class="resize-handle resize-handle-right" title="Drag to resize width"></div>
        <div id="resizeHandleBottom" class="resize-handle resize-handle-bottom" title="Drag to resize height"></div>
        <div id="resizeHandleCorner" class="resize-handle resize-handle-corner" title="Drag to resize width and height"></div>
      </div>
      <div class="flex items-center gap-4 mt-2 text-gray-400 text-xs">
        <span id="coordDisplay">Cell: —</span>
        <span id="cellInfo"></span>
      </div>
    </main>

    <div id="playerScaleIndicator" class="absolute top-3 z-40 bg-gray-900/95 border border-gray-700 rounded-lg shadow-xl p-2 w-48 pointer-events-none" style="left: calc(18rem + 0.75rem);">
      <div class="text-[10px] font-semibold text-gray-300 mb-1">Player Scale</div>
      <canvas id="playerScaleCanvas" width="80" height="80" class="rounded bg-gray-950 border border-gray-700"></canvas>
      <div id="playerScaleText" class="mt-1 text-[10px] text-gray-300"></div>
    </div>

    <div id="recentToolsPalette" class="absolute top-3 right-3 z-40 bg-gray-900/95 border border-gray-700 rounded-lg shadow-xl w-64 p-2">
      <div class="flex items-center justify-between mb-2">
        <div class="text-xs font-semibold text-gray-300">Recent Tools</div>
        <button id="recentToolsToggle" onclick="S.toggleRecentPalette()" class="text-xs text-gray-300 hover:text-white px-1 py-0.5 rounded border border-gray-600 bg-gray-800">▾</button>
      </div>
      <div id="recentToolsContent"></div>
    </div>
  </div>

  <!-- Hidden file input -->
  <input type="file" id="importFileInput" accept=".json" class="hidden">

  <!-- JSON Modal -->
  <div id="jsonModal" class="fixed inset-0 z-50 hidden items-center justify-center modal-overlay">
    <div class="bg-gray-800 border border-gray-600 rounded-lg shadow-xl w-[640px] max-h-[80vh] flex flex-col">
      <div class="flex items-center justify-between px-4 py-3 border-b border-gray-700">
        <span class="font-semibold" id="jsonModalTitle">JSON</span>
        <button onclick="document.getElementById('jsonModal').classList.add('hidden');document.getElementById('jsonModal').classList.remove('flex')" class="text-gray-400 hover:text-white text-lg">✕</button>
      </div>
      <textarea id="jsonModalContent" class="flex-1 bg-gray-900 text-green-300 font-mono text-xs p-4 resize-none focus:outline-none min-h-[300px]" readonly></textarea>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
